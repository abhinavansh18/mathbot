[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mathbot"
version = "1.0.0"
description = "AI-powered math problem solver with OCR, symbolic computation, and verification"
requires-python = ">=3.13"

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",     # file uploads

    # AI / LLM
    "langchain>=0.2.0",
    "langchain-groq>=0.1.5",
    "langchain-community>=0.2.0",
    "langgraph>=0.1.0",
    "wikipedia>=1.4.0",

    # Math
    "sympy>=1.12",

    # OCR
    "pix2tex>=0.1.2",
    "pytesseract>=0.3.10",
    "Pillow>=10.3.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",           # for tests
    "alembic>=1.13.0",

    # Cache / Queue
    "redis[asyncio]>=5.0.4",
    "celery>=5.4.0",
    "flower>=2.0.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Observability
    "structlog>=24.2.0",
    "prometheus-client>=0.20.0",

    # Resilience
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",              # AsyncClient for testing
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

# ── MyPy (type checker) ───────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=70"
