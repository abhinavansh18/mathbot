name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: mathbot_test
          POSTGRES_USER: mathbot
          POSTGRES_PASSWORD: mathbot
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run linter (ruff)
        run: ruff check .

      - name: Run formatter check (ruff)
        run: ruff format --check .

      - name: Run type checker (mypy)
        run: mypy . --ignore-missing-imports
        continue-on-error: true    # warnings only for now

      - name: Run tests with coverage
        env:
          GROQ_API_KEY: test-key-not-used-in-unit-tests
          SECRET_KEY: test-secret-key-for-ci-only
          DATABASE_URL: postgresql+asyncpg://mathbot:mathbot@localhost:5432/mathbot_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -v --cov=. --cov-report=xml --cov-fail-under=70

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t mathbot-api:test .

      - name: Build Worker image
        run: docker build -f docker/Dockerfile.worker -t mathbot-worker:test .
